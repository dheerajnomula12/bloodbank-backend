# ===================================================================
# Blood Bank Management System - Spring Boot Configuration
# ===================================================================
server.port=${PORT:8080}
spring.application.name=blood-bank-management-system

# -------------------------------------------------------------------
# Database Configuration (Default: In-Memory H2 for instant cloud deploy;
# Overridable via SPRING_DATASOURCE_* environment variables for MySQL)
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:blood_bank_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# -------------------------------------------------------------------
# Hibernate / JPA Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

# Disable raw MySQL DDL scripts to let Hibernate + DataInitializer manage schema & seed data cleanly
spring.sql.init.mode=never

# -------------------------------------------------------------------
# Embedded H2 Database Console
# -------------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# -------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.bloodbank=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO

# -------------------------------------------------------------------
# Static Resources Configuration (Frontend UI)
# -------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/
