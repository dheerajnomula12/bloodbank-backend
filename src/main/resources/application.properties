# ===================================================================
# Blood Bank Management System - Spring Boot Configuration
# ===================================================================
server.port=8080
spring.application.name=blood-bank-management-system

# -------------------------------------------------------------------
# Database Configuration (MySQL Database)
# -------------------------------------------------------------------
# To use your local MySQL database:
# 1. Ensure MySQL Server is running on port 3306
# 2. Create the database: CREATE DATABASE blood_bank_db;
# 3. Update the username and password below if needed
spring.datasource.url=jdbc:mysql://localhost:3306/blood_bank_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# Hibernate / JPA Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------------
# Embedded H2 Database (Active only if MySQL is disabled/tested)
# -------------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.bloodbank=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO

# -------------------------------------------------------------------
# Static Resources Configuration (Frontend UI)
# -------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/
